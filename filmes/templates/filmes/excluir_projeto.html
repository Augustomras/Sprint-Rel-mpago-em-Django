

{% extends 'filmes/base.html' %}

{% block title %}Excluir projeto | CineInfo{% endblock %}

{% block content %}
<h1>Excluir projeto</h1>

<p>
    Tem certeza de que deseja excluir
    "{{ projeto.nome }}"?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>

<a href="{% url 'filmes:listar_projetos' %}">
    Cancelar
</a>
{% endblock %}
