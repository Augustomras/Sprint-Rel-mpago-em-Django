
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineInfo{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #222;
        }

        header {
            background-color: #263746;
            padding: 18px 32px;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h2>CineInfo</h2>

            <div>
                <a href="{% url 'filmes:listar_tarefas' %}">Tarefas</a>
                <a href="{% url 'admin:index' %}">Administração</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
